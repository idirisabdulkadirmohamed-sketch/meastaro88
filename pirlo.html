<body>
    <script type="text/javascript">
let iskuDay = 0;

    while (iskuDay < 5) {
        let wanaya = Number(prompt("Enter your number"));

        iskuDay++;

        if (wanaya <= 15) {
            alert("Less than or equal to 15");
        } else {
            alert("More than 15");
        }

        if (iskuDay === 1) {
            alert("Waxaad isku dayday hal mar");
        } else if (iskuDay === 2) {
            alert("Waxaad isku dayday laba mar");
        } else if (iskuDay === 3) {
            alert("Waxaad isku dayday saddex mar");
        } else if (iskuDay === 4) {
            alert("Waxaad isku dayday afar mar");
        } else if (iskuDay === 5) {
            alert("Waxaad isku dayday shan mar");
        }
    }

    alert("what you want it,s over!");
    </script>
</body>
